# Hugo configuration file
title: ModelGate
description: 企业级大模型 API 网关和管理服务

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: 文档
      pageRef: /docs
      weight: 1
    - name: 关于
      pageRef: /about
      weight: 2
    - name: GitHub
      weight: 3
      url: "https://github.com/modelgate/modelgate"
      params:
        icon: github
    - name: 搜索
      weight: 4
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/modelgate/modelgate.github.io/edit/main/content"

  theme:
    # light | dark | system
    default: system
    displayToggle: true
